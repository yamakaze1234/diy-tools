<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DIY 配置工作台 · 可操作原型</title><link rel="stylesheet" href="/style.css"></head><body class="login-required">
<section id="login-screen" aria-labelledby="login-title"><div class="login-card"><div class="brand">DIY<span>配置工作台</span></div><h1 id="login-title">登录工作台</h1><p class="hint">配置、成本与图库，成员之间同步。登录后在本机保留一周，退出或切换账号立即清除。</p><form id="startup-login"><label class="field">成员账号<input name="username" autocomplete="username" required placeholder="请输入成员账号"></label><label class="field">密码<input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码"></label><p id="login-message" role="status" aria-live="polite">正在连接登录服务…</p><button class="primary" type="submit" disabled>登录工作台</button></form></div></section>
<header class="topbar"><a class="brand" href="/">DIY<span>配置工作台</span></a><span class="prototype">本地工作台</span><div class="top-right"><div class="erp-sync-controls"><div><button id="erp-sync">ERP同步</button><button id="erp-setup" title="ERP 连接设置">连接设置</button></div><small id="erp-last">库存 / ERP 尚未同步</small></div><div class="workspace-sync-controls"><button id="workspace-sync">同步</button><small id="workspace-sync-status">正在连接</small></div><button data-nav="logs" id="logs-open">操作记录</button><button id="operator-open" title="账号管理：切换账号或退出登录">操作人</button><span id="save-status" role="status">正在载入</span><button id="save" class="primary">保存本地配置</button></div></header>
<div class="workspace"><aside class="sidebar"><div class="shop" id="shop-card"><span class="shop-brand" id="shop-brand">intel.</span><div><label class="shop-picker-label" for="shop-picker">当前店铺</label><select id="shop-picker" aria-label="切换当前店铺"><option value="intel">英特尔官方旗舰店</option><option value="gigabyte">技嘉旗舰店</option><option value="jonsbo">乔思伯官方旗舰店</option></select><small>商品配置管理</small><button id="shop-settings" class="text-button">店铺优惠券</button></div></div><div class="nav"><button class="active" data-nav="configs">商品配置</button><button id="global-batch-open">本店批量修改</button><button data-nav="cost-source">三店共用成本源</button><button data-nav="source">本店输出源维护</button><button data-nav="templates">本店配置模板</button><button data-nav="exports">图片与导出</button><button data-nav="gallery" id="case-gallery-open">机箱图库</button><button id="inventory-export-open">库存监控导出</button></div><div class="side-title">商品链接 <span id="count"></span></div><button id="new-product" class="wide primary">＋ 新增配置链接</button><select id="link-category-filter" aria-label="按链接分类筛选"><option value="">全部分类</option></select><input id="search" type="search" placeholder="搜索配置、型号或 SKU" aria-label="搜索配置"><div class="selection-tools"><label><input id="select-all" type="checkbox"> 全选</label><span id="selected-count"></span></div><div class="config-delete-tools"><button id="delete-selected" class="danger" disabled>删除所选</button><button id="deleted-configs">已删除配置</button><button id="collapse-all-links">全部折叠</button></div><div id="config-list"></div><div class="sidebar-note">当前店铺内容相互隔离<br>ERP 与核算成本三店共用<br>数据保存在本机</div></aside>
<main class="main"><div class="page-heading"><div><div class="breadcrumb" id="breadcrumb"></div><h1 id="config-heading"></h1></div><div class="heading-actions"><button id="delete-current" class="danger">删除该配置</button><button id="undo" title="撤销本次编辑" disabled>撤销</button><button id="redo" title="重做已撤销的编辑" disabled>重做</button><button id="duplicate">复制配置</button><button id="copy-shop">复制到其他店铺</button><button id="overview">查看配置总览</button></div></div>
<section id="empty-state" class="panel hidden"><h2>暂无配置</h2><p class="hint">可以新建商品链接，或从左侧“已删除配置”恢复。</p><button id="empty-create" class="primary">＋ 新增配置链接</button></section><section id="product-panel" class="panel product-panel"></section><div class="main-actions"><button id="batch">批量修改</button><button id="batch-style">批量配色与格式</button><button id="ids">粘贴 SPU / SKU</button><button id="copy-open" class="dark-button">复制到维护表 <span>↗</span></button></div>
<section class="identity panel"><label>配置名称<input data-config="name"></label><label>版本<input data-config="version"></label><label>SPU<input data-config="spu" inputmode="numeric"></label><label>SKU ID<input data-config="skuId" inputmode="numeric" placeholder="粘贴真实 SKU ID"></label><label class="span-2">维护表简称<input data-config="shortName"></label><div class="span-2 row-tools"><select id="name-format" aria-label="简称格式"><option value="compact">格式二：CPU＋显卡＋内存＋硬盘</option><option value="default">格式一：CPU丨显卡 版本</option></select><button id="name-generate">生成简称</button></div></section>
<section id="cost-summary" class="cost-summary"></section><div class="tabs" role="tablist"><button class="active" data-tab="parts" role="tab">配件配置</button><button data-tab="addons" role="tab">升级与加购</button><button data-tab="modules" role="tab">模块与样式</button><button data-tab="costs" role="tab">成本核算</button></div>
<section id="editor" class="panel editor"></section><div id="sample-note" class="muted footnote"></div>
</main>
<aside class="preview-side"><div class="preview-head"><div><h2>配置图预览</h2><small id="image-status">尚未生成</small></div><div class="preview-head-actions"><button id="preview-expand" aria-expanded="false">放大编辑</button><button id="asset-button">更换机箱图</button><button id="poster-add-image">添加图片</button></div></div><div class="preview-controls"><select id="layout" aria-label="导出版式"><option value="long">紧凑详情图</option><option value="square">1:1 固定方图</option></select><div class="segmented"><button data-theme="light" class="active">浅色</button><button data-theme="dark">深色</button></div><select id="export-width" aria-label="导出宽度"><option value="1400">1400 px</option><option value="2800">2800 px</option><option value="4200">4200 px</option></select></div><div id="overflow" class="error hidden" role="alert"></div><div id="preview-scroll"><div id="poster-stage" tabindex="0" aria-label="配置图编辑画布"><canvas id="poster" aria-label="点击文字调整样式，拖动图片调整位置"></canvas><div id="poster-selection" class="hidden"><button id="case-resize-handle" class="hidden" aria-label="拖动缩放选中的图片"></button></div></div></div><section id="poster-inspector" class="hidden"></section><div class="preview-bottom"><span id="dimensions"></span><small>点击文字改样式 · 拖动图片移位 · 拖动角点缩放</small><label id="poster-layer-control" class="field hidden">添加的图片<select id="poster-image-select" aria-label="选择添加的图片"></select></label><div><button id="download" class="primary">下载 PNG</button><button id="batch-export">批量导出 ZIP</button></div><a id="saved-image" class="hidden" target="_blank">查看已保存图片 ↗</a></div></aside></div>
<dialog id="dialog"><form method="dialog"><div class="dialog-title"><h2 id="dialog-title"></h2><button aria-label="关闭" class="close">×</button></div></form><div id="dialog-body"></div></dialog><div id="toast" class="toast hidden" role="status"></div><input id="asset-file" type="file" accept="image/png,image/jpeg" hidden><input id="poster-image-file" type="file" accept="image/png,image/jpeg" multiple hidden><input id="backup-file" type="file" accept="application/json" hidden><script type="module" src="/bootstrap.js"></script></body></html>
