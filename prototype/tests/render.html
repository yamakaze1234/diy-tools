<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>原型排版验证</title><body style="font:14px 'Microsoft YaHei';background:#edf1f7"><h1>排版验证（独立样例，不写业务数据）</h1><pre id="result">正在验证</pre><div id="images" style="display:flex;gap:15px;align-items:start;flex-wrap:wrap"></div><script type="module">
import {renderPoster} from '../poster.js';import {modulesDefault} from '../core.js';import {makeZip} from '../zip.js';
try{const seed=await(await fetch('../seed.json')).json(),rows=[];let lastCanvas;
for(const theme of ['light','dark'])for(const layout of ['long','square']){const c=structuredClone(seed.configs[0]);c.modules=modulesDefault();c.theme=theme;c.layout=layout;c.benefits=[{text:'福利模块验证：底部内容必须完整',note:''}];c.parts[2].name+=' · 这是用于验证长名称自动换行的完整配件型号';const r=await renderPoster(c,1400);const pixel=[...r.canvas.getContext('2d').getImageData(0,0,1,1).data];rows.push({theme,layout,width:r.canvas.width,height:r.canvas.height,overflow:r.overflow,lastModuleBottom:r.regions.at(-1).bottom,canvasHeight:r.height,corner:pixel,padding:r.padding,fit:r.fit});const holder=document.createElement('section'),label=document.createElement('h2');label.textContent=theme+' '+layout;holder.append(label,r.canvas);r.canvas.style.width='320px';r.canvas.style.height='auto';document.querySelector('#images').append(holder);lastCanvas=r.canvas;}
const png=await new Promise(resolve=>lastCanvas.toBlob(resolve,'image/png')),bytes=new Uint8Array(await png.arrayBuffer()),zip=makeZip([{name:'深色方图.png',bytes},{name:'清单.json',bytes:new TextEncoder().encode(JSON.stringify(rows))}]);const zi=new Uint8Array(await zip.arrayBuffer());
const assertions={allImagesRendered:rows.length===4,allContentVisible:rows.every(r=>r.lastModuleBottom<=r.canvasHeight),squareExact:rows.filter(r=>r.layout==='square').every(r=>r.width===r.height),longPortrait:rows.filter(r=>r.layout==='long').every(r=>r.height>r.width),fixedSquare:rows.filter(r=>r.layout==='square').every(r=>!r.padding&&r.fit===1),zipSignature:new DataView(zi.buffer).getUint32(0,true)===0x04034b50};document.querySelector('#result').textContent=JSON.stringify({assertions,rows,pngBytes:bytes.length,zipBytes:zi.length},null,2);
}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:e.message,stack:e.stack});}
</script></body></html>
