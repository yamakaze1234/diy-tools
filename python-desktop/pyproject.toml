[project]
name = "diy-workbench-desktop"
version = "1.0.5"
description = "DIY configuration workbench for Windows"
requires-python = "==3.13.*"
dependencies = [
    "cryptography==50.0.1",
    "pyOpenSSL==26.4.0",
    "python-tds==1.17.1",
    "pywebview==6.2.1",
    "quickjs-ng==0.16.2.1",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pyinstaller==6.22.3", "setuptools==84.0.0"]

[tool.uv]
package = false
# The application uses Windows WebView2 and Windows credential APIs.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# Preserve the complete pre-migration dependency versions, including transitives.
constraint-dependencies = [
    "altgraph==0.17.5",
    "bottle==0.13.4",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "clr_loader==0.3.1",
    "cryptography==50.0.1",
    "idna==3.19",
    "packaging==26.3",
    "pefile==2024.8.26",
    "proxy_tools==0.1.0",
    "pycparser==3.0",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
    "pyOpenSSL==26.4.0",
    "python-tds==1.17.1",
    "pythonnet==3.1.0",
    "pywebview==6.2.1",
    "pywin32-ctypes==0.2.3",
    "quickjs-ng==0.16.2.1",
    "requests==2.34.2",
    "setuptools==84.0.0",
    "typing_extensions==4.16.0",
    "urllib3==2.8.0",
]
